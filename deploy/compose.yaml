# Production stack for Openship (see deploy/README.md). openship.json at the
# repo root points here. Build contexts are relative to this file, so `..` is
# the repo root that both Dockerfiles expect.
#
# Only wiring lives here. Secrets are set in Openship as service-scoped
# variables, so each container gets only its own (deploy/README.md): the
# database password goes to postgres (POSTGRES_PASSWORD) and api (DATABASE_URL)
# and never to web. PUBLIC_URL, which isn't secret, is a project variable that
# also feeds the ${...} interpolation below.
#
# Networks keep web away from the database: web and api share "default", and
# postgres sits with api and backup on "data", which has no route out.
name: cauldron

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    # POSTGRES_PASSWORD comes from a service variable in Openship.
    environment:
      POSTGRES_USER: cauldron
      POSTGRES_DB: cauldron
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [data]
    # Over TCP: during first-boot init Postgres answers on its socket only.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cauldron", "-d", "cauldron"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Internal only: no ports, reachable by the web service alone. TRUST_PROXY
  # is safe because of that (#21, "Security settings").
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in Openship}
      TRUST_PROXY: "true"
      STORAGE_DIR: /app/apps/api/.data/storage
    # DATABASE_URL (postgres://cauldron:<password>@postgres:5432/cauldron) and the
    # other secrets come from service variables in Openship.
    volumes:
      # A named volume inherits the image's bun ownership of this directory.
      - photos:/app/apps/api/.data
    networks: [default, data]
    expose:
      - "3001"
    # Called inside the container, so it never spends the public /v1/health budget.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:3001/v1/health").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # The only public service. Openship's proxy terminates TLS in front of it.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_ORIGIN: http://api:3001
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in Openship}
      TRUST_PROXY: "true"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:3000/favicon.svg").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Nightly pg_dump plus the photos, encrypted by restic into a bucket off the
  # VPS. PGPASSWORD, RESTIC_* and AWS_* are service variables in Openship
  # (deploy/README.md). It reaches postgres on "data" and the bucket through
  # "outbound", and shares no network with web or api.
  backup:
    build:
      context: backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: cauldron
      PGDATABASE: cauldron
      PHOTOS_DIR: /photos
    volumes:
      - photos:/photos:ro
      - restic-cache:/root/.cache/restic
    networks: [data, outbound]

networks:
  default:
  data:
    internal: true
  outbound:

volumes:
  postgres:
  photos:
  restic-cache:
