name: Live imports

# Reads real recipe sites and social posts the way Distill does. Sites and
# platforms change without notice, so this runs weekly and on demand, and a
# failed run (GitHub emails it) means an importer needs a look.

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      # Secrets on this step only, out of reach of install scripts.
      - name: Live imports
        working-directory: apps/api
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_OEMBED_TOKEN: ${{ secrets.INSTAGRAM_OEMBED_TOKEN }}
        run: bun run test:live
