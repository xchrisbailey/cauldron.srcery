name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cauldron
          POSTGRES_PASSWORD: cauldron
          POSTGRES_DB: cauldron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cauldron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cauldron:cauldron@localhost:5432/cauldron_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format, lint and typecheck
        run: bunx vp check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
