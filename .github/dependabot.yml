# Keeps the pinned GitHub Actions and Docker base images current. npm packages
# are left out on purpose: effect and Better Auth are upgraded deliberately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /deploy/backup
    schedule:
      interval: weekly
    # The backup image's Postgres must match the database's major (see below).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  # Postgres majors need a dump and restore (a new major can't open the old data
  # directory), so only minor and patch bumps come through for it.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
