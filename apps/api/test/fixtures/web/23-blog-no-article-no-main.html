      <div class="post-title">Quick Guacamole</div>
      <div class="body">
        <p>Three minutes, one bowl.</p>
        <p><strong>Ingredients</strong></p>
        <ul>
          <li>3 ripe avocados</li>
          <li>1 lime, juiced</li>
          <li>1/4 cup red onion, minced</li>
          <li>1/2 tsp salt</li>
        </ul>
        <p><strong>Method</strong></p>
        <ol>
          <li>Mash the avocados with the lime juice.</li>
          <li>Stir in the onion and salt.</li>
        </ol>
